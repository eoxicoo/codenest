<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Space Code - organize suas tecnologias, tarefas e projetos de programação.">
  <meta name="author" content="Grupo PW1">
  <title>Tarefas | Space Code</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,800" rel="stylesheet">
  <link rel="icon" type="image/png" href="imagens/logo-icone.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topo">
    <a class="logo" href="index.html"><img src="imagens/logo.png" alt="Space Code"></a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="materias.html">Matérias</a></li>
        <li><a class="ativo" href="tarefas.html">Tarefas</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li id="link-relatorio" class="oculto"><a href="relatorio.html">Relatório</a></li>
        <li><a href="index.html#acesso" id="link-login">Entrar</a></li>
      </ul>
    </nav>
  </header>
  <main id="area-restrita">
    <div class="titulo-pagina">
      <span class="etiqueta">Kanban</span>
      <h1>Tarefas do dia</h1>
      <p>Crie tarefas e mova entre A fazer, Fazendo e Feito.</p>
    </div>
    <form name="formTarefa" onsubmit="return salvarTarefa();">
      <fieldset>
        <legend>Nova tarefa</legend>
        <div class="campos">
          <label for="titulo">Título:
            <input type="text" id="titulo" name="titulo" placeholder="Ex.: Estudar arrow functions">
          </label>
          <label for="materia">Matéria:
            <input type="text" id="materia" name="materia" placeholder="Ex.: JavaScript">
          </label>
          <label for="prioridade">Prioridade:
            <select id="prioridade" name="prioridade">
              <option value="Baixa">Baixa</option>
              <option value="Média">Média</option>
              <option value="Alta">Alta</option>
            </select>
          </label>
        </div>
        <input type="submit" value="Adicionar">
      </fieldset>
    </form>
    <p id="mensagem"></p>
    <div class="kanban">
      <div class="coluna"><h3>A fazer</h3><div id="col-fazer"></div></div>
      <div class="coluna"><h3>Fazendo</h3><div id="col-fazendo"></div></div>
      <div class="coluna"><h3>Feito</h3><div id="col-feito"></div></div>
    </div>
  </main>
  <footer>
    <div class="rodape">
      <a class="logo" href="index.html"><img src="imagens/logo.png" alt="Space Code"></a>
      <p>Trabalho PW1 - organize seus estudos e projetos</p>
      <a href="mailto:contato@spacecode.com">contato@spacecode.com</a>
    </div>
  </footer>
  <a class="topo" href="#topo">↑</a>
  <script src="script.js"></script>
</body>
</html>

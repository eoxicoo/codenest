<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Space Code - organize suas tecnologias, tarefas e projetos de programação.">
  <meta name="author" content="Grupo PW1">
  <title>Matérias | Space Code</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,800" rel="stylesheet">
  <link rel="icon" type="image/png" href="imagens/logo-icone.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topo">
    <a class="logo" href="index.html"><img src="imagens/logo.png" alt="Space Code"></a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a class="ativo" href="materias.html">Matérias</a></li>
        <li><a href="tarefas.html">Tarefas</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li id="link-relatorio" class="oculto"><a href="relatorio.html">Relatório</a></li>
        <li><a href="index.html#acesso" id="link-login">Entrar</a></li>
      </ul>
    </nav>
  </header>
  <main id="area-restrita">
    <div class="titulo-pagina">
      <span class="etiqueta">Estudos</span>
      <h1>Matérias e tecnologias</h1>
      <p>Cadastre o que você está aprendendo e acompanhe as horas de estudo.</p>
    </div>
    <form name="formMateria" onsubmit="return salvarMateria();">
      <fieldset>
        <legend>Nova tecnologia</legend>
        <div class="campos">
          <label for="nome-materia">Nome:
            <input type="text" id="nome-materia" name="nome" placeholder="Ex.: Java, Angular, MySQL">
          </label>
          <label for="nivel">Nível:
            <select id="nivel" name="nivel">
              <option value="Iniciante">Iniciante</option>
              <option value="Intermediário">Intermediário</option>
              <option value="Avançado">Avançado</option>
            </select>
          </label>
          <label for="horas">Horas estudadas:
            <input type="number" id="horas" name="horas" value="0" min="0">
          </label>
        </div>
        <input type="submit" value="Adicionar">
      </fieldset>
    </form>
    <p id="mensagem"></p>
    <div class="grade" id="lista-materias"></div>
  </main>
  <footer>
    <div class="rodape">
      <a class="logo" href="index.html"><img src="imagens/logo.png" alt="Space Code"></a>
      <p>Trabalho PW1 - organize seus estudos e projetos</p>
      <a href="mailto:contato@spacecode.com">contato@spacecode.com</a>
    </div>
  </footer>
  <a class="topo" href="#topo">↑</a>
  <script src="script.js"></script>
</body>
</html>

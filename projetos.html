<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Space Code - organize suas tecnologias, tarefas e projetos de programação.">
  <meta name="author" content="Grupo PW1">
  <title>Projetos | Space Code</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,800" rel="stylesheet">
  <link rel="icon" type="image/png" href="imagens/logo-icone.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topo">
    <a class="logo" href="index.html"><img src="imagens/logo.png" alt="Space Code"></a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="materias.html">Matérias</a></li>
        <li><a href="tarefas.html">Tarefas</a></li>
        <li><a class="ativo" href="projetos.html">Projetos</a></li>
        <li id="link-relatorio" class="oculto"><a href="relatorio.html">Relatório</a></li>
        <li><a href="index.html#acesso" id="link-login">Entrar</a></li>
      </ul>
    </nav>
  </header>
  <main id="area-restrita">
    <div class="titulo-pagina">
      <span class="etiqueta">Portfólio</span>
      <h1>Meus projetos</h1>
      <p>Guarde os links e as descrições dos seus mini-projetos.</p>
    </div>
    <form name="formProjeto" onsubmit="return salvarProjeto();">
      <fieldset>
        <legend>Novo projeto</legend>
        <div class="campos">
          <label for="nome-projeto">Nome:
            <input type="text" id="nome-projeto" name="nome" placeholder="Ex.: Site da cafeteria">
          </label>
          <label for="link">Link (GitHub, site...):
            <input type="text" id="link" name="link" placeholder="https://github.com/...">
          </label>
        </div>
        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao" rows="3" placeholder="O que esse projeto faz?"></textarea>
        <input type="submit" value="Adicionar">
      </fieldset>
    </form>
    <p id="mensagem"></p>
    <div class="grade" id="lista-projetos"></div>
  </main>
  <footer>
    <div class="rodape">
      <a class="logo" href="index.html"><img src="imagens/logo.png" alt="Space Code"></a>
      <p>Trabalho PW1 - organize seus estudos e projetos</p>
      <a href="mailto:contato@spacecode.com">contato@spacecode.com</a>
    </div>
  </footer>
  <a class="topo" href="#topo">↑</a>
  <script src="script.js"></script>
</body>
</html>
